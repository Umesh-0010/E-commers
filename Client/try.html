<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expandable Product Card</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #f2f2f2;
  }

  .product-card {
    width: 200px;
    height: 200px;
    background-color: #fff;
    border-radius: 15px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    transition: all 0.3s ease;
    position: relative;
  }

  .product-card.expanded {
    width: 300px;
    height: 400px;
  }

  .product-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: all 0.3s ease;
  }

  .product-card.expanded img {
    height: 50%;
  }

  .product-details {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 15px;
    opacity: 0;
    transition: opacity 0.3s ease;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: rgba(255, 255, 255, 0.95);
  }

  .product-card.expanded .product-details {
    opacity: 1;
  }

  .product-details h3 {
    margin: 0;
    font-size: 18px;
    color: #333;
  }

  .product-details p {
    margin: 0;
    font-size: 16px;
    color: #666;
  }

  .product-details button {
    padding: 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
  }

  .buy-btn {
    background-color: #28a745;
    color: white;
  }

  .buy-btn:hover {
    background-color: #218838;
  }

  .cart-btn {
    background-color: #ffc107;
    color: #333;
  }

  .cart-btn:hover {
    background-color: #e0a800;
  }
</style>
</head>
<body>

<div class="product-card" id="productCard">
  <img style=";" src="./public/images/img1.png" alt="Product Image">
  <div class="product-details">
    <h3>Product Name</h3>
    <p>$99.99</p>
    <button class="buy-btn">Buy Now</button>
    <button class="cart-btn">Add to Cart</button>
  </div>
</div>

<script>
  const card = document.getElementById('productCard');
  card.addEventListener('click', () => {
    card.classList.toggle('expanded');
  });
</script>

</body>
</html>
